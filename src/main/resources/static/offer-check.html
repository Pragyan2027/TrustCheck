<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check an offer letter</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d2433; --muted: #5b6475; --line: #dcdad2;
    --accent: #0f5c4d; --low: #1f7a4d; --med: #b26a00; --high: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181f; --card: #1c222c; --ink: #e8ebf1; --muted: #9aa3b5; --line: #2e3644;
            --accent: #4fb89f; --low: #5fcf94; --med: #e0a23c; --high: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label.drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 22px;
               text-align: center; cursor: pointer; color: var(--muted); }
  label.drop:hover, label.drop:focus-within { border-color: var(--accent); color: var(--ink); }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  textarea { width: 100%; min-height: 180px; margin-top: 12px; padding: 10px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 14px/1.5 inherit; resize: vertical; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { margin-top: 10px; color: var(--muted); min-height: 1.5em; }
  #status.err { color: var(--high); }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; color: #fff; font-weight: 700; }
  .LOW { background: var(--low); } .MEDIUM { background: var(--med); } .HIGH { background: var(--high); }
  .flag { border-left: 4px solid var(--line); padding: 4px 0 4px 12px; margin: 14px 0; }
  .flag.CRITICAL, .flag.HIGH { border-color: var(--high); }
  .flag.MEDIUM { border-color: var(--med); }
  .flag.LOW { border-color: var(--muted); }
  .flag h3 { margin: 0; font-size: 1rem; }
  .flag blockquote { margin: 6px 0; padding: 0; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
  .flag p { margin: 0; }
  .pos { color: var(--low); margin: 6px 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; overflow-wrap: anywhere; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .note { font-size: .875rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Check an offer letter</h1>
  <p class="sub">Upload a PDF, a screenshot or a photo, or paste the text. Photos are read on your device. Only the text is sent to the server, and nothing is stored.</p>

  <section class="card">
    <label class="drop">
      <input id="file" type="file" accept="image/*,.pdf,.txt,application/pdf,text/plain">
      Choose a file (PDF, image or .txt)
    </label>
    <textarea id="text" placeholder="…or paste the offer letter text here. Text read from an image appears here so you can fix any mistakes before checking."></textarea>
    <button id="go" type="button">Check this letter</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section id="result" class="card" hidden></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fileEl = $('file'), textEl = $('text'), goEl = $('go'), statusEl = $('status'), resultEl = $('result');

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.className = isError ? 'err' : '';
  }

  // One place for every server call, so errors always say what really happened.
  async function api(url, options) {
    let res;
    try {
      res = await fetch(url, options);
    } catch (e) {
      throw new Error('Could not reach the server from ' + location.origin + '. Make sure the app is running and open this page at http://localhost:8080/offer-check.html');
    }
    const raw = await res.text();
    let body = {};
    try { body = JSON.parse(raw); } catch (e) { /* not JSON, e.g. an HTML error page */ }
    if (!res.ok) {
      const err = new Error('');
      err.status = res.status;
      err.serverMessage = body.error || body.message || '';
      err.notJson = !raw.trim().startsWith('{');
      err.url = url;
      throw err;
    }
    return body;
  }

  function describe(e) {
    if (e.status === undefined) return e.message || 'Something went wrong.';
    let msg = 'Server answered ' + e.status + ' for ' + e.url;
    if (e.serverMessage) msg += ': ' + e.serverMessage;
    if (e.status === 404 || (e.notJson && e.status !== 422)) {
      msg += '. This page is probably not being served by the Spring Boot app. The address bar should start with http://localhost:8080/ (not file:// or localhost:63342).';
    } else if (e.status === 413) {
      msg += '. The file is too large. Raise spring.servlet.multipart.max-file-size in application.properties.';
    } else if (e.status === 500) {
      msg += '. Check the IntelliJ console for the stack trace.';
    }
    return msg;
  }

  fileEl.addEventListener('change', async () => {
    const file = fileEl.files[0];
    if (!file) return;
    resultEl.hidden = true;
    const name = file.name.toLowerCase();
    try {
      if (file.type.startsWith('image/')) {
        await readImage(file);
      } else if (name.endsWith('.pdf')) {
        await analyzePdf(file);
      } else if (name.endsWith('.txt')) {
        textEl.value = await file.text();
        setStatus('Text loaded. Check it, then press "Check this letter".');
      } else {
        setStatus('Please choose a PDF, an image or a .txt file.', true);
      }
    } catch (e) {
      setStatus(describe(e), true);
    } finally {
      fileEl.value = '';   // lets you pick the same file again
    }
  });

  // Scale up and grey-scale small screenshots: Tesseract reads larger, higher-contrast text better.
  async function prepareImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.max(1, Math.min(3, 2000 / bmp.width));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.filter = 'grayscale(1) contrast(1.3)';   // ignored by browsers that do not support it
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      return canvas;
    } catch (e) {
      return file;   // fall back to the original image
    }
  }

  // Images: OCR in the browser (Tesseract.js). The picture never leaves the device.
  async function readImage(file) {
    goEl.disabled = true;
    setStatus('Reading the image… the first time can take a minute while the language data downloads.');
    try {
      const source = await prepareImage(file);
      const { data } = await Tesseract.recognize(source, 'eng', {
        logger: m => { if (m.status === 'recognizing text') setStatus('Reading the image… ' + Math.round(m.progress * 100) + '%'); }
      });
      const text = (data.text || '').trim();
      if (!text) throw new Error('No text found in this image. Try a sharper, straight-on photo.');
      textEl.value = text;
      setStatus('Text read from the image. Fix any mistakes, then press "Check this letter".');
    } finally {
      goEl.disabled = false;
    }
  }

  // PDFs: the server extracts the text (works for text-based PDFs).
  async function analyzePdf(file) {
    goEl.disabled = true;
    setStatus('Checking the PDF…');
    try {
      const form = new FormData();
      form.append('file', file);
      const body = await api('/api/offer-letter/analyze-file', { method: 'POST', body: form });
      setStatus('');
      render(body);
    } catch (e) {
      if (e.status === 422) {
        throw new Error(e.serverMessage || 'No readable text in this PDF. It may be a scan. Take a screenshot of each page and upload the images instead.');
      }
      throw e;
    } finally {
      goEl.disabled = false;
    }
  }

  goEl.addEventListener('click', async () => {
    const text = textEl.value.trim();
    if (!text) { setStatus('Add a letter first: choose a file or paste the text.', true); return; }
    goEl.disabled = true;
    setStatus('Checking…');
    try {
      const body = await api('/api/offer-letter/analyze-text', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text })
      });
      setStatus('');
      render(body);
    } catch (e) {
      setStatus(describe(e), true);
    } finally {
      goEl.disabled = false;
    }
  });

  // Letter text is untrusted, so everything is inserted with textContent, never innerHTML.
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function render(a) {
    resultEl.replaceChildren();
    const head = el('div');
    head.append(el('span', 'badge ' + a.riskLevel, a.riskLevel + ' RISK  ' + a.riskScore + '/100'));
    resultEl.append(head, el('p', null, a.summary));

    if (a.redFlags.length) {
      resultEl.append(el('h2', null, 'Warning signs'));
      a.redFlags.forEach(f => {
        const box = el('div', 'flag ' + f.severity);
        box.append(el('h3', null, f.title));
        if (f.evidence) box.append(el('blockquote', null, '“' + f.evidence + '”'));
        box.append(el('p', null, f.advice));
        resultEl.append(box);
      });
    }
    if (a.positives.length) {
      resultEl.append(el('h2', null, 'Reassuring signs'));
      a.positives.forEach(p => resultEl.append(el('div', 'pos', p)));
    }

    const x = a.extracted, list = el('dl');
    const row = (k, v) => { if (v && v.length) { list.append(el('dt', null, k), el('dd', null, Array.isArray(v) ? v.join(', ') : v)); } };
    row('Company', x.companyName); row('Role', x.jobTitle); row('Emails', x.emails);
    row('Domains', x.companyDomains); row('Amounts', x.amounts);
    if (list.children.length) resultEl.append(el('h2', null, 'Found in the letter'), list);

    resultEl.append(el('p', 'note', 'This is an automated check, not proof either way. Always verify the company yourself.'));
    resultEl.hidden = false;
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>
</body>
</html>
